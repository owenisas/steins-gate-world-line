  :root { color-scheme: dark; --lab: #0E0F0D; --lab-ink: #D6D9CF; }

  html, body { margin: 0; background: var(--lab); color: var(--lab-ink); }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;

  button { font: inherit; color: var(--lab-ink); background: #1b1c19; border: 1px solid #2b2c28; border-radius: 6px;

  button:hover { background: #242521; }
  button:focus-visible { outline: 2px solid #D6D9CF; outline-offset: 2px; }
  output { display: block; min-height: 1.5em; font: 13px/1.4 ui-monospace, Menlo, monospace; color: rgb(214 217 207 / .6); }
  section.row { display: grid; justify-items: center; gap: 20px; padding: 72px 20px; }

  <script type="module">
    import { meter, meterAll } from '../assets/meter/meter.js';

    const log = document.getElementById('log');
    const all = meterAll();
    const [mini, hero, footer, nf] = ['mini', 'hero', 'footer', 'nf'].map((id) => meter(document.getElementById(id)));
    const rnd = () => `${Math.random() < 0.5 ? 0 : 1}.${String(Math.floor(Math.random() * 1e6)).padStart(6, '0')}`;
    const events = [];
    document.addEventListener('meter:lock', (e) => events.push({ id: e.target.id, ...e.detail, t: performance.now() }));
    document.addEventListener('meter:locked', (e) => {
      if (e.target.id === 'hero') log.textContent = `locked ${e.detail.value} (${e.detail.mode})`;
    });
    window.__meter = { all, mini, hero, footer, nf, events, rnd };

    document.addEventListener('click', (e) => {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (!act) return;
      const v = rnd();
      if (act === 'shift') { hero.shiftTo(v); mini.shiftTo(v); }
      if (act === 'instant') { hero.shiftTo(v, { roll: false }); mini.shiftTo(v, { roll: false }); }
      if (act === 'ignite') hero.ignite('1.130426');
      if (act === 'reread') hero.reread();
      if (act === 'faris') hero.shiftTo(' 275349');
      if (act === 'fail') nf.fail();
    });

    // The WebGL hero: after load + idle; any failure leaves the DOM meter as it is.
    if (!new URLSearchParams(location.search).has('nogl')) {
      import('../assets/meter/meter-gl.js')
        .then(({ mountMeterGL }) => mountMeterGL(document.getElementById('stage'), { value: '1.130426' }))
        .then((gl) => { window.__meter.gl = gl; })
        .catch((err) => console.warn('[harness] meter-gl unavailable:', err));
    }
  </script>
</body>
</html>
